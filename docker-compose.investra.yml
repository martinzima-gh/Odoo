# Samostatná vývojová instance bez Odoo Mates.
# Spuštění: docker compose -f docker-compose.investra.yml up -d
name: odoo-investra

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${INVESTRA_DB_PASSWORD:?Nastavte INVESTRA_DB_PASSWORD v .env}
      POSTGRES_DB: postgres
    ports:
      # Jen pro tento počítač; přístup přes účet dbeaver_ro pouze pro čtení.
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  odoo:
    # Připnuté sestavení Odoo 20; aktualizovat řízeně (řízení změn).
    image: odoo:20.0-20261102
    command:
      - odoo
      - --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons/custom
      - --database=investra_dev
      - --no-database-list
    depends_on:
      - db
    ports:
      - "127.0.0.1:8070:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${INVESTRA_DB_PASSWORD:?Nastavte INVESTRA_DB_PASSWORD v .env}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons/custom:/mnt/extra-addons/custom

volumes:
  db-data:
  odoo-data:
