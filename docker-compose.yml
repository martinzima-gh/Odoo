services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?Nastavte ODOO_DB_PASSWORD v .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  odoo:
    image: odoo:19.0
    command:
      - odoo
      - --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons/third_party/odoomates
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?Nastavte ODOO_DB_PASSWORD v .env}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
volumes:
  db-data:
  odoo-data:
